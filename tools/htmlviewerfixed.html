<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Code Viewer LOL</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<style>
:root {
  --bg: #070a12;
  --panel: rgba(14, 19, 32, 0.8);
  --accent: #4cc9f0;
  --text: #e0e0e0;
  --border: #1f2a44;
  --success: #4caf50;
}


* { box-sizing: border-box; }


body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', Tahoma, sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}


#particle-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
}


header {
  padding: 12px 16px;
  background: rgba(17, 22, 42, 0.9);
  backdrop-filter: blur(5px);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  z-index: 10;
}


header h1 {
  font-size: 16px;
  margin: 0;
  color: var(--accent);
  text-shadow: 0 0 8px rgba(76, 201, 240, 0.5);
}


.controls { display: flex; gap: 8px; align-items: center; }


button, label.upload-btn, .external-link {
  background: rgba(14, 19, 32, 0.6);
  border: 1px solid var(--accent);
  color: var(--accent);
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.2s;
  font-size: 13px;
  outline: none;
  text-decoration: none;
  display: inline-block;
}


button:hover, label.upload-btn:hover, .external-link:hover {
  background: var(--accent);
  color: #000;
}


.external-link {
  border-color: #ff9e00;
  color: #ff9e00;
}
.external-link:hover {
  background: #ff9e00;
  color: #000;
}


.copy-success {
  border-color: var(--success) !important;
  color: var(--success) !important;
}


#fileInput { display: none; }


main {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  padding: 15px;
  z-index: 1;
}


textarea {
  width: 100%;
  height: 100%;
  background: var(--panel);
  backdrop-filter: blur(10px);
  color: #dcdcdc;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  font-family: 'Consolas', 'Monaco', monospace;
  font-size: 14px;
  resize: none;
  outline: none;
}


iframe {
  width: 100%;
  height: 100%;
  background: white;
  border-radius: 12px;
  border: none;
}


/* FULLSCREEN LOGIC */
.fullscreen {
  position: fixed !important;
  inset: 0;
  z-index: 9999;
  border-radius: 0;
}


body.is-fullscreen header {
  display: none;
}


body.is-fullscreen main {
  padding: 0;
}


/* FLOATING EXIT BUTTON */
#exitFullscreenBtn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 10000;
  background: rgba(0, 0, 0, 0.6);
  border: 1px solid var(--accent);
  padding: 10px 15px;
  display: none; /* Hidden by default */
  backdrop-filter: blur(5px);
  font-weight: bold;
}


body.is-fullscreen #exitFullscreenBtn {
  display: block; /* Only show in fullscreen */
}
</style>
</head>
<body>


<canvas id="particle-canvas"></canvas>


<button id="exitFullscreenBtn" onclick="toggleFullscreen()">[⤬]</button>


<header>
  <h1>Code viewer LOL</h1>
  <div class="controls">
    <label class="upload-btn">
      Upload File
      <input type="file" id="fileInput" accept=".html,.txt,.js,.css">
    </label>
    <button id="copyBtn" onclick="copyCode()">Copy Code</button>
    <button onclick="saveCode()">Save HTML</button>
    <button onclick="runCode()" style="background: rgba(76, 201, 240, 0.1);">Run code</button>
    <button onclick="toggleFullscreen()">Fullscreen</button>
  </div>
</header>


<main>
  <textarea id="code" spellcheck="false">
<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background: #111;
      color: #4cc9f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
    }
    .box {
      padding: 2rem;
      border: 2px solid #4cc9f0;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 20px rgba(76, 201, 240, 0.3);
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Preview Mode</h1>
    <p>The floating button in the bottom right will take you back.</p>
  </div>
</body>
</html></textarea>
  <iframe id="preview"></iframe>
</main>


<script>
const codeArea = document.getElementById("code");
const preview = document.getElementById("preview");
const fileInput = document.getElementById("fileInput");
const copyBtn = document.getElementById("copyBtn");


function runCode() {
  preview.srcdoc = codeArea.value;
}


function toggleFullscreen() {
  preview.classList.toggle("fullscreen");
  document.body.classList.toggle("is-fullscreen");
}


function copyCode() {
  navigator.clipboard.writeText(codeArea.value).then(() => {
    const originalText = copyBtn.innerText;
    copyBtn.innerText = "Copied! ✓";
    copyBtn.classList.add("copy-success");
    particles.forEach(p => { p.speedX *= 5; p.speedY *= 5; });
    setTimeout(() => {
      copyBtn.innerText = originalText;
      copyBtn.classList.remove("copy-success");
      particles.forEach(p => { p.speedX /= 5; p.speedY /= 5; });
    }, 1500);
  });
}


function saveCode() {
  const code = codeArea.value;
  let fileName = prompt("Enter a name for your file:", "my-code.html");
  if (!fileName) return;
  if (!fileName.toLowerCase().endsWith(".html")) fileName += ".html";


  const blob = new Blob([code], { type: "text/html" });
  const href = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = href;
  link.download = fileName;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(href);
}


fileInput.addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => { codeArea.value = e.target.result; runCode(); };
  reader.readAsText(file);
});


// --- Particle System ---
const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');
let particles = [];


function initCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}


class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * canvas.width;
    this.y = Math.random() * canvas.height;
    this.size = Math.random() * 2 + 0.5;
    this.speedX = Math.random() * 0.6 - 0.3;
    this.speedY = Math.random() * 0.6 - 0.3;
    this.opacity = Math.random() * 0.5 + 0.1;
  }
  update() {
    this.x += this.speedX;
    this.y += this.speedY;
    if (this.x > canvas.width) this.x = 0;
    if (this.x < 0) this.x = canvas.width;
    if (this.y > canvas.height) this.y = 0;
    if (this.y < 0) this.y = canvas.height;
  }
  draw() {
    ctx.fillStyle = `rgba(76, 201, 240, ${this.opacity})`;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}


function setupParticles() {
  particles = [];
  for (let i = 0; i < 100; i++) { particles.push(new Particle()); }
}


function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles.forEach(p => { p.update(); p.draw(); });
  requestAnimationFrame(animate);
}


window.addEventListener('resize', () => { initCanvas(); setupParticles(); });


initCanvas();
setupParticles();
animate();
runCode();
</script>


</body>
</html>
