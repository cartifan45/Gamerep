<!DOCTYPE html><html><head><style>*{box-sizing:border-box;margin:0;padding:0}body{height:100vh;display:flex;flex-direction:column;background:var(--bg-base);color:var(--text-primary);font-family:system-ui,sans-serif;overflow:hidden}#v{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}#v>div{background:var(--bg-surface);border:1px solid var(--border-subtle);border-radius:12px;width:100%;max-width:520px;padding:40px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}h2{margin-bottom:8px;font-size:24px;font-weight:600}p{color:var(--text-secondary);font-size:14px;margin-bottom:32px;line-height:1.5}#d{border:2px dashed var(--border-subtle);border-radius:8px;padding:40px 20px;cursor:pointer;transition:all .2s;position:relative}#d:hover,#d.o{border-color:var(--accent);background:rgba(37,99,235,.05)}#d input{position:absolute;width:100%;height:100%;top:0;left:0;opacity:0;cursor:pointer}#g{flex:1;border:none;width:100%;height:100%;background:#000}</style></head><body><div id=v><div><h2>Select Project Directory</h2><p>Upload a folder containing an <code>index.html</code>. We will map all assets to dynamic Blob URIs and run them directly in isolation.</p><div id=d><div style="margin-bottom:12px;font-size:32px">📁</div><div style="font-weight:500;margin-bottom:4px">Drag and drop or click to browse</div><div style="color:var(--text-secondary);font-size:12px">Ensure an index.html is in the root</div><input type=file id=f webkitdirectory directory multiple></div></div></div><iframe id=g hidden sandbox="allow-scripts allow-same-origin allow-pointer-lock"></iframe><script>d.ondragenter=d.ondragover=()=>d.classList.add('o');d.ondragleave=d.ondrop=()=>d.classList.remove('o');f.onchange=async()=>{let m={},h="";for(let y of f.files){let q=y.webkitRelativePath.replace(/^.*?\//,'');m[q]=URL.createObjectURL(y);if(q=="index.html")h=await y.text()}if(!h)return alert("Missing index.html");let p=new DOMParser().parseFromString(h,'text/html'),k=z=>z.replace(/^\.?\//,'');['src','href'].map(t=>p.querySelectorAll(`[${t}]`).forEach(e=>{let w=m[k(e.getAttribute(t))];if(w)e.setAttribute(t,w)}));g.srcdoc=p.documentElement.outerHTML.replace('<head>',`<head><script>let v=${JSON.stringify(m)},r=u=>v[u.toString().replace(/^\\.?\\//,'')]||u,f=window.fetch;window.fetch=(u,o)=>f(r(u),o);let X=XMLHttpRequest.prototype,p=X.open;X.open=function(M,u,a,y,z){return p.call(this,M,r(u),a,y,z)};let I=HTMLImageElement.prototype,i=Object.getOwnPropertyDescriptor(I,'src');Object.defineProperty(I,'src',{set(u){i.set.call(this,r(u))},get(){return i.get.call(this)}});<\/script>`);v.remove();g.hidden=false}</script></body></html>
